<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#241c15;--muted:#7a6c5d;--gold:#b8892f;--gold-d:#8f6a1f;--line:#eadfce;--wa:#1fa855}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#241c15;color:#f3e3bf;text-align:center;padding:22px 16px 18px}
header h1{margin:0;font-size:30px;letter-spacing:7px;padding-left:7px;font-weight:400;font-family:Georgia,"Times New Roman",serif;color:#e6c273}
header .logo{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 8px;box-shadow:0 0 0 2px #e6c273}
header h1{display:none}
header p{margin:6px 0 0;font-size:14px;color:#cdb98e}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;font-family:inherit}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:999px;font-size:15px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
main{padding:14px 12px 110px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#ddd}
.info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:700;font-size:15px;line-height:1.4}
.en{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.price{color:var(--gold-d);font-weight:700}
.add{margin-top:auto;border:0;background:var(--gold);color:#fff;padding:10px;border-radius:10px;font-size:15px;font-family:inherit;cursor:pointer}
.add:active{background:var(--gold-d)}
.cartbar{position:fixed;bottom:0;right:0;left:0;z-index:30;background:#241c15;color:#fff;padding:12px 16px;display:none;justify-content:space-between;align-items:center}
.cartbar.show{display:flex}
.cartbar button{background:var(--wa);color:#fff;border:0;padding:10px 20px;border-radius:10px;font-size:16px;font-family:inherit;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.show{display:flex}
.panel{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-width:600px;margin:auto}
.panel h2{margin:0 0 12px;font-size:20px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.row .t{flex:1;font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.send{width:100%;margin-top:16px;background:var(--wa);color:#fff;border:0;padding:14px;border-radius:12px;font-size:17px;font-family:inherit;cursor:pointer}
.close{float:left;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 12px 24px}
.card.out img{filter:grayscale(1);opacity:.45}
.card.out .add{background:#b9b1a6;cursor:not-allowed}
.wafab{position:fixed;left:14px;bottom:16px;z-index:25;display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;padding:11px 16px;border-radius:999px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.wafab svg{width:22px;height:22px;fill:#fff}
body.hascart .wafab{bottom:80px}
.info-box{max-width:1100px;margin:0 auto 14px;padding:0 12px}
.info-box h2{font-size:17px;margin:6px 0 10px}
.info-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px){.info-grid{grid-template-columns:1fr 1fr}}
.info-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.info-item b{display:block;color:var(--gold-d);font-size:13px}
.info-item a{color:var(--gold-d)}
</style>
</head>

// منتج بلا صورة يظهر بصورة بديلة إلى أن تضيف صورته
const IMAGES = new Proxy(IMAGES0,{get:(o,k)=>o[k]||("data:image/svg+xml;utf8,"+encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><rect width="320" height="240" fill="#2b2118"/><text x="160" y="120" fill="#d9bf86" font-size="26" text-anchor="middle" font-family="Arial">TAJ</text><text x="160" y="152" fill="#9c8a66" font-size="14" text-anchor="middle" font-family="Arial">Heaven Scents</text></svg>'))});
/* ======================================== */

// عطور نفدت: ضع أرقامها هنا، مثل [3,12]، فتظهر "نفد المخزون" ولا يمكن طلبها
const SOLD_OUT = [];
// معلومات الشراء: اترك أي سطر فارغاً "" فيختفي من الصفحة
const STORE_INFO = {
  "طريقة الدفع": "نقداً عند الاستلام",
  "التوصيل": "لكل مدن ليبيا، والمدة من يوم إلى عدة أيام حسب المدينة",
  "أوقات العمل": "",        // مثال: يومياً من 10 صباحاً إلى 10 مساءً
  "الاستبدال والإرجاع": "", // اكتب سياستك هنا
  "فيسبوك": ""              // ضع رابط صفحتك
};
const CATS=[["all","الكل"],["men","رجالي"],["women","نسائي"],["oriental","شرقي"],["taj","تاج"]];
let cat="all", term="", cart={};
const $=id=>document.getElementById(id);
const money=p=>p==null?"السعر عند الطلب":p+" "+CURRENCY;

$("tabs").innerHTML=CATS.map(([k,l])=>`<button data-k="${k}" class="${k==="all"?"on":""}">${l}</button>`).join("");
$("tabs").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cat=k;
  [...$("tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.k===k));render()};
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
$("city").innerHTML=Object.keys(DELIVERY).map(c=>`<option>${c}</option>`).join("");

function render(){
  const list=PRODUCTS.filter(p=>(cat==="all"||p.cat===cat)&&(!term||(p.ar+" "+p.en).toLowerCase().includes(term)));
  $("empty").style.display=list.length?"none":"block";
  $("grid").innerHTML=list.map(p=>`
   <div class="card${SOLD_OUT.includes(p.id)?" out":""}">
    <img src="${IMAGES[p.id]}" alt="${p.en}" loading="lazy">
    <div class="info">
      <div class="name">${p.ar}</div>
      <div class="en">${p.en}</div>
      <div class="meta"><span>${p.ml?p.ml+" مل":"&nbsp;"}</span><span class="price">${money(p.price)}</span></div>
      ${SOLD_OUT.includes(p.id)?'<button class="add" disabled>نفد المخزون</button>':`<button class="add" data-id="${p.id}">أضف للطلب</button>`}
    </div></div>`).join("");
}
$("grid").onclick=e=>{const id=e.target.dataset.id;if(!id)return;cart[id]=(cart[id]||0)+1;updateBar()};

function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function updateBar(){
  const n=count();$("cartbar").classList.toggle("show",n>0);document.body.classList.toggle("hascart",n>0);
  $("cartinfo").textContent=n+" منتج في الطلب";
  if($("sheet").classList.contains("show"))drawItems();
}
function drawItems(){
  const ids=Object.keys(cart);
  if(!ids.length){$("sheet").classList.remove("show");updateBar();return}
  $("items").innerHTML=ids.map(id=>{const p=PRODUCTS.find(x=>x.id==id);return `
   <div class="row"><img src="${IMAGES[id]}" alt="">
    <div class="t">${p.ar}<br><small style="color:#7a6c5d">${p.ml?p.ml+" مل • ":""}${money(p.price)}</small></div>
    <div class="qty"><button data-m="${id}">−</button><b>${cart[id]}</b><button data-p="${id}">+</button></div></div>`}).join("");
  feeNote();
}
function feeNote(){
  const f=DELIVERY[$("city").value];
  $("feenote").textContent=f==null?"رسوم التوصيل ستُحدَّد عند تأكيد الطلب. الدفع نقداً عند الاستلام.":"رسوم التوصيل: "+f+" "+CURRENCY+". الدفع نقداً عند الاستلام.";
}
$("city").onchange=feeNote;
$("items").onclick=e=>{const d=e.target.dataset;
  if(d.p)cart[d.p]++;
  if(d.m){cart[d.m]--;if(cart[d.m]<=0)delete cart[d.m]}
  updateBar();drawItems()};
$("open").onclick=()=>{drawItems();$("sheet").classList.add("show")};
$("close").onclick=()=>$("sheet").classList.remove("show");
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("show")};

$("send").onclick=()=>{
  const name=$("cname").value.trim(),addr=$("addr").value.trim(),phone=$("cphone").value.trim();
  if(!name||!addr||!phone){alert("من فضلك اكتب الاسم ورقم الهاتف والعنوان");return}
  let total=0,known=true;
  const lines=Object.keys(cart).map(id=>{const p=PRODUCTS.find(x=>x.id==id);
    if(p.price==null)known=false;else total+=p.price*cart[id];
    return `• ${p.ar} (${p.en}) ${p.ml?p.ml+" مل ":""}× ${cart[id]}`+(p.price!=null?` = ${p.price*cart[id]} ${CURRENCY}`:"")});
  const city=$("city").value,fee=DELIVERY[city];
  let msg=`السلام عليكم، أريد طلب:\n${lines.join("\n")}\n`;
  if(known)msg+=`\nمجموع العطور: ${total} ${CURRENCY}`;
  if(fee!=null)msg+=`\nالتوصيل: ${fee} ${CURRENCY}`;
  if(known&&fee!=null)msg+=`\nالإجمالي: ${total+fee} ${CURRENCY}`;
  msg+=`\n\nالاسم: ${name}\nالهاتف: ${phone}\nالمدينة: ${city}\nالعنوان: ${addr}`;
  const n=$("notes").value.trim();if(n)msg+=`\nملاحظات: ${n}`;
  msg+=`\nالدفع: نقداً عند الاستلام`;
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");
};
(function(){
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rows=Object.entries(STORE_INFO).filter(([k,v])=>v&&String(v).trim());
  $("infogrid").innerHTML=rows.map(([k,v])=>{
    const val=/^https?:\/\//.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v);
    return `<div class="info-item"><b>${esc(k)}</b>${val}</div>`}).join("");
  $("infobox").style.display=rows.length?"block":"none";
  $("wafab").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("السلام عليكم، عندي استفسار");
})();
render();
</script>
