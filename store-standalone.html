<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>ركن الإكسسوارات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style id="appstyle">
/* Layout: sticky header, category chips, product grid, bottom cart bar that opens an order sheet; owner-only admin sheet */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --fg: #11262b;
  --muted: #5d7177;
  --line: #d9e2e4;
  --accent: #0b7a6b;
  --accent-fg: #ffffff;
  --hot: #f2b134;
  --tile-a: #dff1ee;
  --tile-b: #fbefd2;
  --tile-c: #e3e9f6;
  --danger: #b3261e;
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1d; --surface: #152428; --fg: #e8f1f2; --muted: #96aab0; --line: #26393e;
    --accent: #3cc2ae; --accent-fg: #07201c; --hot: #f2b134;
    --tile-a: #1b3a38; --tile-b: #3b3220; --tile-c: #1f2a45; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1d; --surface: #152428; --fg: #e8f1f2; --muted: #96aab0; --line: #26393e;
  --accent: #3cc2ae; --accent-fg: #07201c; --hot: #f2b134;
  --tile-a: #1b3a38; --tile-b: #3b3220; --tile-c: #1f2a45; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px;
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.2; margin: 0; min-width: 0; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .8rem; color: var(--muted); }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.cod { font-size: .8rem; font-weight: 700; color: var(--fg); background: var(--hot); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.intro { padding-block: 22px 8px; }
.intro h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 52ch; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px; }
.chip {
  font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 16px; border-radius: 999px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.tile { aspect-ratio: 4 / 3; display: grid; place-items: center; max-width: 100%; }
.tile svg { width: 44%; height: auto; fill: none; stroke: var(--fg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tile.a { background: var(--tile-a); } .tile.b { background: var(--tile-b); } .tile.c { background: var(--tile-c); }
.info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cat { font-size: .75rem; color: var(--muted); letter-spacing: .02em; }
.name { font-weight: 700; line-height: 1.35; margin: 0; font-size: 1rem; }
.price { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; margin-top: auto; padding-top: 6px; }
.price span { font-family: var(--font-body); font-weight: 500; font-size: .8rem; color: var(--muted); }
button.add {
  font: inherit; font-weight: 700; cursor: pointer; margin-top: 8px; padding: 8px; border-radius: 8px;
  border: 1px solid var(--accent); background: transparent; color: var(--accent);
}
button.add:hover { background: var(--accent); color: var(--accent-fg); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
footer.note { margin-top: 28px; padding-block: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }

.bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar .sum { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; }
.bar .sum small { display: block; font-weight: 400; color: var(--muted); }
button.primary {
  font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 10px; padding: 11px 20px;
  background: var(--accent); color: var(--accent-fg);
}
button.primary:disabled { opacity: .45; cursor: not-allowed; }

.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
}
.sheet h3 { font-family: var(--font-display); font-weight: 800; margin: 0; font-size: 1.25rem; }
.sheet h4 { font-family: var(--font-display); font-weight: 800; margin: 18px 0 4px; font-size: 1rem; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
button.ghost { font: inherit; cursor: pointer; background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 4px 12px; }
button.ghost.danger { color: var(--danger); border-color: var(--danger); }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.line .ln { font-weight: 700; min-width: 0; }
.line .lp { font-variant-numeric: tabular-nums; font-weight: 700; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { font: inherit; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.qty output { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.totals { padding-block: 12px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.totals div { display: flex; justify-content: space-between; }
.totals .grand { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
form.order, .stack { display: grid; gap: 10px; margin-top: 6px; }
form.order label, .stack label, .arow label { display: grid; gap: 4px; font-weight: 500; font-size: .92rem; min-width: 0; }
form.order input, form.order textarea, .stack input, .arow input:not([type="checkbox"]), .arow select {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
}
.err { color: var(--danger); font-size: .88rem; min-height: 1.2em; margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.empty { color: var(--muted); padding-block: 24px; text-align: center; }
.help { color: var(--muted); font-size: .85rem; margin: 0; }
.arow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding-block: 14px; border-bottom: 1px solid var(--line); align-items: end; }
.arow .full { grid-column: 1 / -1; }
.arow .chk { display: flex; align-items: center; gap: 8px; }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .9rem; }
@media (max-width: 380px) { .row2, .arow { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .card:hover { transform: translateY(-2px); } }
</style>

</head>
<body>
<template id="shell">
<div dir="rtl" lang="ar">
<div class="wrap">
  <header class="top">
    <h1 class="brand"><span id="storeName"></span><small>إكسسوارات هواتف، هدايا، ومنتجات منزلية</small></h1>
    <div class="actions">
      <button class="ghost" id="adminBtn" type="button" hidden>إدارة المتجر</button>
      <span class="cod">الدفع عند الاستلام</span>
    </div>
  </header>

  <section class="intro">
    <h2>اختر منتجاتك، وأرسل الطلب على واتساب</h2>
    <p>نؤكد معك الطلب بالاتصال، ونوصله إلى باب بيتك، وتدفع عند الاستلام.</p>
  </section>

  <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
  <main class="grid" id="grid"></main>
  <p class="empty" id="noItems" hidden>لا توجد منتجات معروضة الآن.</p>

  <footer class="note">الطلب يصلنا عبر واتساب، ونتصل بك لتأكيده قبل التوصيل.</footer>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="sum"><span id="barCount"></span><small>الإجمالي بدون التوصيل</small></div>
    <button class="primary" id="openCart" type="button">مراجعة الطلب</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle">طلبك</h3>
      <button class="ghost" id="closeCart" type="button">إغلاق</button>
    </div>
    <div id="lines"></div>
    <div class="totals" id="totals"></div>
    <form class="order" id="orderForm" novalidate>
      <label for="cName">الاسم
        <input id="cName" name="name" autocomplete="name" required>
      </label>
      <div class="row2">
        <label for="cPhone">رقم الهاتف
          <input id="cPhone" name="phone" inputmode="tel" autocomplete="tel" required dir="ltr" placeholder="09XXXXXXXX">
        </label>
        <label for="cCity">المدينة
          <input id="cCity" name="city" value="طرابلس" required>
        </label>
      </div>
      <label for="cAddr">العنوان أو أقرب نقطة دالة
        <textarea id="cAddr" name="addr" rows="2"></textarea>
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="primary" type="submit" id="sendWa">إرسال الطلب عبر واتساب</button>
      <button class="ghost" type="button" id="copyOrder">نسخ نص الطلب</button>
      <p class="help" id="waHelp"></p>
    </form>
  </div>
</div>

<div class="overlay" id="adminOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="sheet-head">
      <h3 id="adminTitle">إدارة المتجر</h3>
      <button class="ghost" id="aClose" type="button">إغلاق</button>
    </div>
    <p class="help">تظهر هذه اللوحة لك وحدك. التغييرات تُنشر في المتجر عند الضغط على حفظ.</p>
    <h4>بيانات المتجر</h4>
    <div class="stack">
      <label for="aStore">اسم المتجر <input id="aStore"></label>
      <div class="row2">
        <label for="aPhone">رقم واتساب <input id="aPhone" inputmode="tel" dir="ltr" placeholder="09XXXXXXXX"></label>
        <label for="aFee">رسوم التوصيل (د.ل) <input id="aFee" inputmode="decimal" dir="ltr"></label>
      </div>
    </div>
    <h4>المنتجات</h4>
    <div id="aRows"></div>
    <datalist id="cats"></datalist>
    <div class="stack">
      <button class="ghost" type="button" id="aAdd">إضافة منتج</button>
      <p class="err" id="aErr" role="alert"></p>
      <button class="primary" type="button" id="aSave">حفظ ونشر التغييرات</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
</div>
</template>

<script type="application/json" id="store-data">{"config":{"storeName":"ركن الإكسسوارات","whatsapp":"218912367081","currency":"د.ل","deliveryFee":10},"products":[{"id":1,"name":"جراب هاتف شفاف مقوّى","cat":"إكسسوارات الهواتف","price":25,"tone":"a","icon":"phone","on":true},{"id":2,"name":"شاحن سريع 25 واط","cat":"إكسسوارات الهواتف","price":45,"tone":"b","icon":"plug","on":true},{"id":3,"name":"سماعة بلوتوث لاسلكية","cat":"إكسسوارات الهواتف","price":90,"tone":"c","icon":"phones","on":true},{"id":4,"name":"حامل هاتف للسيارة","cat":"إكسسوارات الهواتف","price":30,"tone":"a","icon":"phone","on":true},{"id":5,"name":"علبة هدية مخصصة بالاسم","cat":"هدايا","price":60,"tone":"b","icon":"gift","on":true},{"id":6,"name":"ميدالية مطبوعة","cat":"هدايا","price":15,"tone":"c","icon":"gift","on":true},{"id":7,"name":"منظم أدراج للمطبخ","cat":"منتجات منزلية","price":35,"tone":"a","icon":"box","on":true},{"id":8,"name":"مجموعة أكياس تخزين","cat":"منتجات منزلية","price":28,"tone":"b","icon":"box","on":true}]}</script>

<div id="root"></div>

<script id="app">
var DATA = JSON.parse(document.getElementById("store-data").textContent);
var CONFIG = DATA.config;
var PRODUCTS = DATA.products;
var ICONS = {
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4"/>',
  phones: '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  gift: '<rect x="3.5" y="9" width="17" height="11" rx="1.5"/><path d="M12 9v11M3.5 13h17M12 9C9 9 8 5 10.5 5 12 5 12 9 12 9zm0 0c3 0 4-4 1.5-4C12 5 12 9 12 9z"/>',
  box: '<path d="M3.5 8L12 4l8.5 4v8L12 20l-8.5-4V8zM3.5 8L12 12l8.5-4M12 12v8"/>'
};
var ICON_LABELS = { phone: "هاتف", plug: "شاحن", phones: "سماعة", gift: "هدية", box: "صندوق" };
var RESET_CSS = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
var FONTS_HREF = "https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap";

document.getElementById("root").innerHTML = document.getElementById("shell").innerHTML;

var $ = function (id) { return document.getElementById(id); };
var fmt = function (n) { return Number(n).toLocaleString("en-US") + " " + CONFIG.currency; };
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function visible() { return PRODUCTS.filter(function (p) { return p.on !== false; }); }

var cart = {};
var activeCat = "الكل";
try { var saved = JSON.parse(localStorage.getItem("store-cart") || "{}"); if (saved && typeof saved === "object") cart = saved; } catch (e) {}
Object.keys(cart).forEach(function (k) { if (!PRODUCTS.some(function (p) { return String(p.id) === k && p.on !== false; })) delete cart[k]; });
function persist() { try { localStorage.setItem("store-cart", JSON.stringify(cart)); } catch (e) {} }

function productById(id) { return PRODUCTS.find(function (p) { return p.id === Number(id); }); }
function count() { return Object.keys(cart).reduce(function (s, k) { return s + cart[k]; }, 0); }
function subtotal() { return Object.keys(cart).reduce(function (s, k) { var p = productById(k); return s + (p ? p.price * cart[k] : 0); }, 0); }

function renderChips() {
  var cats = ["الكل"].concat(visible().map(function (p) { return p.cat; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; }));
  if (cats.indexOf(activeCat) < 0) activeCat = "الكل";
  $("chips").innerHTML = cats.map(function (c) {
    return '<button type="button" class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (c === activeCat) + '">' + esc(c) + '</button>';
  }).join("");
}
function renderGrid() {
  var list = visible().filter(function (p) { return activeCat === "الكل" || p.cat === activeCat; });
  $("noItems").hidden = visible().length > 0;
  $("grid").innerHTML = list.map(function (p) {
    return '<article class="card"><div class="tile ' + esc(p.tone) + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[p.icon] || ICONS.box) + '</svg></div>' +
      '<div class="info"><span class="cat">' + esc(p.cat) + '</span><h3 class="name">' + esc(p.name) + '</h3>' +
      '<div class="price">' + esc(p.price) + ' <span>' + esc(CONFIG.currency) + '</span></div>' +
      '<button type="button" class="add" data-add="' + p.id + '">أضف إلى الطلب</button></div></article>';
  }).join("");
}
function renderBar() {
  var n = count();
  $("bar").hidden = n === 0;
  $("barCount").textContent = n + (n === 1 ? " منتج: " : " منتجات: ") + fmt(subtotal());
}
function renderCart() {
  var ids = Object.keys(cart);
  if (!ids.length) {
    $("lines").innerHTML = '<p class="empty">الطلب فارغ. أضف منتجات من القائمة.</p>';
    $("totals").innerHTML = "";
    $("sendWa").disabled = true; $("copyOrder").disabled = true;
    return;
  }
  $("sendWa").disabled = false; $("copyOrder").disabled = false;
  $("lines").innerHTML = ids.map(function (id) {
    var p = productById(id);
    return '<div class="line"><div class="ln">' + esc(p.name) + '</div><div class="lp">' + fmt(p.price * cart[id]) + '</div>' +
      '<div class="qty"><button type="button" data-dec="' + id + '" aria-label="إنقاص">−</button><output>' + cart[id] +
      '</output><button type="button" data-inc="' + id + '" aria-label="زيادة">+</button></div><span></span></div>';
  }).join("");
  var sub = subtotal();
  $("totals").innerHTML = '<div><span>المنتجات</span><span>' + fmt(sub) + '</span></div>' +
    '<div><span>التوصيل</span><span>' + fmt(CONFIG.deliveryFee) + '</span></div>' +
    '<div class="grand"><span>الإجمالي عند الاستلام</span><span>' + fmt(sub + CONFIG.deliveryFee) + '</span></div>';
}
function refresh() { persist(); renderBar(); renderCart(); }

function toast(msg) {
  var t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 1800);
}
function change(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  refresh();
}
function orderText() {
  var f = $("orderForm");
  var lines = Object.keys(cart).map(function (id) {
    var p = productById(id); return "- " + p.name + " × " + cart[id] + " = " + fmt(p.price * cart[id]);
  });
  var total = subtotal() + CONFIG.deliveryFee;
  return "طلب جديد من " + CONFIG.storeName + "\n\n" + lines.join("\n") +
    "\n\nالمنتجات: " + fmt(subtotal()) + "\nالتوصيل: " + fmt(CONFIG.deliveryFee) + "\nالإجمالي عند الاستلام: " + fmt(total) +
    "\n\nالاسم: " + f.name.value.trim() + "\nالهاتف: " + f.phone.value.trim() + "\nالمدينة: " + f.city.value.trim() +
    (f.addr.value.trim() ? "\nالعنوان: " + f.addr.value.trim() : "");
}
function valid() {
  var f = $("orderForm");
  if (!f.name.value.trim()) { $("err").textContent = "اكتب اسمك."; f.name.focus(); return false; }
  if (f.phone.value.replace(/\D/g, "").length < 9) { $("err").textContent = "اكتب رقم هاتف صحيحاً."; f.phone.focus(); return false; }
  if (!f.city.value.trim()) { $("err").textContent = "اكتب المدينة."; f.city.focus(); return false; }
  $("err").textContent = ""; return true;
}

$("chips").addEventListener("click", function (e) {
  var b = e.target.closest("[data-cat]"); if (!b) return;
  activeCat = b.getAttribute("data-cat"); renderChips(); renderGrid();
});
$("grid").addEventListener("click", function (e) {
  var b = e.target.closest("[data-add]"); if (!b) return;
  change(b.getAttribute("data-add"), 1); toast("أُضيف إلى الطلب");
});
$("lines").addEventListener("click", function (e) {
  var i = e.target.closest("[data-inc]"), d = e.target.closest("[data-dec]");
  if (i) change(i.getAttribute("data-inc"), 1);
  if (d) change(d.getAttribute("data-dec"), -1);
});
$("openCart").addEventListener("click", function () { renderCart(); $("overlay").hidden = false; });
$("closeCart").addEventListener("click", function () { $("overlay").hidden = true; });
$("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) $("overlay").hidden = true; });
$("orderForm").addEventListener("submit", function (e) {
  e.preventDefault();
  if (!valid()) return;
  var url = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(orderText());
  var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  $("waHelp").textContent = "إن لم يفتح واتساب، انسخ نص الطلب وأرسله إلى الرقم " + CONFIG.whatsapp + ".";
});
$("copyOrder").addEventListener("click", function () {
  if (!valid()) return;
  var txt = orderText();
  function fallback() {
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("تم نسخ نص الطلب"); } catch (er) { toast("حدد النص وانسخه يدوياً"); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast("تم نسخ نص الطلب"); }, fallback);
  } else { fallback(); }
});

/* ===== لوحة الإدارة: تظهر لمالك الصفحة فقط ===== */
var draft = null;
var TONES = ["a", "b", "c"];
function localPhone(n) { return /^218/.test(n) ? "0" + n.slice(3) : n; }
function normPhone(raw) {
  var d = String(raw).replace(/\D/g, "").replace(/^00/, "");
  if (/^0/.test(d)) d = "218" + d.slice(1);
  return d;
}
function renderAdminRows() {
  var iconOpts = Object.keys(ICON_LABELS);
  $("aRows").innerHTML = draft.products.map(function (p, i) {
    return '<div class="arow" data-i="' + i + '">' +
      '<label class="full" for="an' + i + '">اسم المنتج<input id="an' + i + '" data-f="name" value="' + esc(p.name) + '"></label>' +
      '<label for="ac' + i + '">التصنيف<input id="ac' + i + '" data-f="cat" list="cats" value="' + esc(p.cat) + '"></label>' +
      '<label for="ap' + i + '">السعر (د.ل)<input id="ap' + i + '" data-f="price" inputmode="decimal" dir="ltr" value="' + esc(p.price) + '"></label>' +
      '<label for="ai' + i + '">الشكل<select id="ai' + i + '" data-f="icon">' + iconOpts.map(function (k) {
        return '<option value="' + k + '"' + (k === p.icon ? " selected" : "") + '>' + ICON_LABELS[k] + '</option>';
      }).join("") + '</select></label>' +
      '<label class="chk" for="ao' + i + '"><input type="checkbox" id="ao' + i + '" data-f="on"' + (p.on !== false ? " checked" : "") + '> ظاهر في المتجر</label>' +
      '<button type="button" class="ghost danger full" data-del="' + i + '">حذف المنتج</button></div>';
  }).join("");
  var cats = draft.products.map(function (p) { return p.cat; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; });
  $("cats").innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("");
}
function openAdmin() {
  draft = JSON.parse(JSON.stringify(DATA));
  $("aStore").value = draft.config.storeName;
  $("aPhone").value = localPhone(draft.config.whatsapp);
  $("aFee").value = draft.config.deliveryFee;
  $("aErr").textContent = "";
  renderAdminRows();
  $("adminOverlay").hidden = false;
}
$("adminBtn").addEventListener("click", openAdmin);
$("aClose").addEventListener("click", function () { $("adminOverlay").hidden = true; });
function onRowEdit(e) {
  var t = e.target, row = t.closest("[data-i]"); if (!row || !t.getAttribute("data-f")) return;
  var p = draft.products[Number(row.getAttribute("data-i"))], f = t.getAttribute("data-f");
  p[f] = f === "on" ? t.checked : t.value;
}
$("aRows").addEventListener("input", onRowEdit);
$("aRows").addEventListener("change", onRowEdit);
$("aRows").addEventListener("click", function (e) {
  var b = e.target.closest("[data-del]"); if (!b) return;
  draft.products.splice(Number(b.getAttribute("data-del")), 1);
  renderAdminRows();
});
$("aAdd").addEventListener("click", function () {
  var nextId = draft.products.reduce(function (m, p) { return Math.max(m, p.id); }, 0) + 1;
  var last = draft.products.length ? draft.products[draft.products.length - 1].cat : "";
  draft.products.push({ id: nextId, name: "", cat: last, price: "", tone: "a", icon: "box", on: true });
  renderAdminRows();
  var el = $("an" + (draft.products.length - 1)); if (el) { el.focus(); el.scrollIntoView({ block: "center" }); }
});

function buildDoc(data) {
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  var parts = [
    "<title>" + esc(data.config.storeName) + "</title>",
    '<meta name="claude:viewport-fit-sides" content="cover">',
    '<link rel="preconnect" href="https://fonts.googleapis.com">',
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
    '<link rel="stylesheet" href="' + FONTS_HREF + '">',
    '<style id="appstyle">' + $("appstyle").textContent + "</style>",
    $("shell").outerHTML,
    '<script type="application/json" id="store-data">' + json + "<\/script>",
    '<div id="root"></div>',
    '<script id="app">' + $("app").textContent + "<\/script>"
  ];
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
    RESET_CSS + '</style></head><body>\n' + parts.join("\n") + "\n\n</body></html>";
}
function fail(msg) { $("aErr").textContent = msg; $("aSave").disabled = false; $("aSave").textContent = "حفظ ونشر التغييرات"; }
$("aSave").addEventListener("click", function () {
  var name = $("aStore").value.trim(), phone = normPhone($("aPhone").value), fee = parseFloat($("aFee").value.replace(",", "."));
  if (!name) return fail("اكتب اسم المتجر.");
  if (phone.length < 11) return fail("اكتب رقم واتساب صحيحاً، مثل 0912345678.");
  if (isNaN(fee) || fee < 0) return fail("اكتب رسوم التوصيل كرقم.");
  var products = [];
  for (var i = 0; i < draft.products.length; i++) {
    var p = draft.products[i], price = parseFloat(String(p.price).replace(",", "."));
    if (!String(p.name).trim()) return fail("اكتب اسم كل منتج أو احذف الصف الفارغ.");
    if (isNaN(price) || price < 0) return fail("اكتب سعراً صحيحاً للمنتج: " + p.name);
    products.push({ id: p.id, name: String(p.name).trim(), cat: String(p.cat).trim() || "أخرى", price: price, tone: TONES[i % 3], icon: p.icon || "box", on: p.on !== false });
  }
  var next = { config: { storeName: name, whatsapp: phone, currency: CONFIG.currency, deliveryFee: fee }, products: products };
  $("aErr").textContent = ""; $("aSave").disabled = true; $("aSave").textContent = "جارٍ النشر...";
  window.claude.use("artifact").then(function (art) {
    if (!art) throw { code: "not_granted" };
    return art.publish(buildDoc(next));
  }).catch(function (err) {
    var c = err && err.code;
    if (c === "conflict") return;
    fail(c === "not_writer" || c === "not_granted" ? "ليس لديك صلاحية تعديل هذا المتجر." : "تعذر النشر. حاول مرة أخرى بعد قليل.");
  });
});

$("storeName").textContent = CONFIG.storeName;
renderChips(); renderGrid(); renderBar();

if (window.claude && window.claude.use) {
  window.claude.use("user").then(function (u) { return u ? u.canEdit() : false; })
    .then(function (ok) { if (ok) $("adminBtn").hidden = false; })
    .catch(function () {});
}
</script>

</body>
</html>
